<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz 21 de septiembre❤️ ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            background: #fff176; /* amarillo claro */
            overflow-x: hidden;
            color: #5a4634;
        }

        .start-screen {
            position: fixed;
            inset: 0;
            background: #ffeb3b; /* amarillo vibrante */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .start-title {
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            color: #5a4634;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .start-button {
            padding: 12px 28px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: #ff7eb3;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.3s ease;
        }
        .start-button:hover {
            background: #ff4081;
            transform: scale(1.05);
        }

        .main-content {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease;
            padding: 20px;
            text-align: center;
        }
        .main-content.active {
            opacity: 1;
            transform: translateY(0);
        }

        .main-title {
            font-size: 2.5rem;
            font-family: 'Pacifico', cursive;
            color: #ff4081;
            margin-bottom: 30px;
        }

        .sunflower-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        /* Flor */
        .flower_wrapper {
            position: relative;
            width: 150px;
            height: 150px;
        }
        .flower_stem {
            position: absolute;
            width: 10px;
            height: 200px;
            background: #3c9d3c;
            left: 50%;
            transform: translateX(-50%);
            top: 50px;
        }
        .flower_center {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #5a4634;
            border-radius: 50%;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .flower_petal {
            position: absolute;
            width: 60px;
            height: 90px;
            background: #ffdd57;
            border-radius: 50% 50% 0 0;
            top: 10px;
            left: 50%;
            transform-origin: bottom center;
        }
        .flower_petal-1 { transform: translateX(-50%) rotate(0deg); }
        .flower_petal-2 { transform: translateX(-50%) rotate(30deg); }
        .flower_petal-3 { transform: translateX(-50%) rotate(60deg); }
        .flower_petal-4 { transform: translateX(-50%) rotate(90deg); }
        .flower_petal-5 { transform: translateX(-50%) rotate(120deg); }
        .flower_petal-6 { transform: translateX(-50%) rotate(150deg); }
        .flower_petal-7 { transform: translateX(-50%) rotate(180deg); }
        .flower_petal-8 { transform: translateX(-50%) rotate(210deg); }
        .flower_petal-9 { transform: translateX(-50%) rotate(240deg); }
        .flower_petal-10 { transform: translateX(-50%) rotate(270deg); }
        .flower_petal-11 { transform: translateX(-50%) rotate(300deg); }
        .flower_petal-12 { transform: translateX(-50%) rotate(330deg); }

        .flower_leaf {
            position: absolute;
            width: 60px;
            height: 30px;
            background: #3c9d3c;
            border-radius: 50%;
            top: 150px;
        }
        .flower_leaf-1 { left: -40px; transform: rotate(-30deg); }
        .flower_leaf-2 { right: -40px; transform: rotate(30deg); }

        /* Mensaje */
        .love-message-section {
            margin: 50px auto;
            max-width: 800px;
            background: #fff59d;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .love-message-content h2 {
            font-family: 'Pacifico', cursive;
            font-size: 2rem;
            color: #ff4081;
        }
        .love-message-content p {
            font-size: 1.2rem;
            margin: 15px 0;
            line-height: 1.6;
        }
        .footer-image {
            margin-top: 20px;
            max-width: 150px;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Pétalos flotantes */
        .flotantes-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        .petalo {
            position: absolute;
            top: -50px;
            font-size: 1.5rem;
            color: #f57f17;
            animation: caer linear forwards;
        }
        @keyframes caer {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Música */
        #musicButton {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ff4081;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #musicButton svg {
            width: 30px;
            height: 30px;
            fill: white;
        }
        #pauseIcon { display: none; }
    </style>
</head>
<body>

    <!-- Pantalla de inicio -->
    <div class="start-screen" id="startScreen">
        <h1 class="start-title">PARA TI SOLEDAD ❤️</h1>
        <button class="start-button" id="startBtn">Abrir</button>
    </div>

    <!-- Partículas flotantes -->
    <div class="flotantes-container" id="flotantesContainer"></div>

    <div class="main-content" id="mainContainer">
        
        <h1 class="main-title">Feliz 21 de septiembre❤️</h1>

        <div class="sunflower-container">
            <div class="sunflower">
                <div class="flower_wrapper">
                    <div class="flower_stem"></div>
                    <div class="flower_center"></div>
                    <div class="flower_petal flower_petal-1"></div>
                    <div class="flower_petal flower_petal-2"></div>
                    <div class="flower_petal flower_petal-3"></div>
                    <div class="flower_petal flower_petal-4"></div>
                    <div class="flower_petal flower_petal-5"></div>
                    <div class="flower_petal flower_petal-6"></div>
                    <div class="flower_petal flower_petal-7"></div>
                    <div class="flower_petal flower_petal-8"></div>
                    <div class="flower_petal flower_petal-9"></div>
                    <div class="flower_petal flower_petal-10"></div>
                    <div class="flower_petal flower_petal-11"></div>
                    <div class="flower_petal flower_petal-12"></div>
                    <div class="flower_leaf flower_leaf-1"></div>
                    <div class="flower_leaf flower_leaf-2"></div>
                </div>
            </div>
        </div>

        <!-- https://www.dl.dropboxusercontent.com/scl/fi/01pulh8w6pmr1thbcctxb/flower.png?rlkey=jx0ufhpnrw07hsynrfbitkr6q&st=bzxns3c1 -->
        <section class="love-message-section">
            <div class="love-message-content">
                <h2>Mi Girasol🌻</h2>
                <p>✨ Soledad, hoy quiero dedicarte este detalle, eres una personita muy especial para mi. Feliz 21 de septiembre❤️.  🌼</p>
                <img src="https://www.kukyflor.com/10736-large_default/ramo-de-10-girasoles.jpg" alt="Flor amarilla" class="footer-image">
            </div>
        </section>
    </div>
    
    <!-- Música -->
    <audio id="backgroundMusic" loop>
        <source src="https://dl.dropboxusercontent.com/scl/fi/xac2mz0t4homhkvkr1d5w/FLORES-AMARILLAS.mp3?rlkey=uush4yu80dlaz54tbfilgdnb5&st=d0wjojvs" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <button id="musicButton">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
    </button>

    <script>
        const startBtn = document.getElementById('startBtn');
        const startScreen = document.getElementById('startScreen');
        const mainContainer = document.getElementById('mainContainer');
        const backgroundMusic = document.getElementById('backgroundMusic');
        const musicButton = document.getElementById('musicButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const flotantesContainer = document.getElementById('flotantesContainer');

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            mainContainer.classList.add('active');
            backgroundMusic.play();
        });

        musicButton.addEventListener('click', () => {
            if (backgroundMusic.paused) {
                backgroundMusic.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                backgroundMusic.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        function crearPetalo() {
            const petalo = document.createElement('div');
            petalo.classList.add('petalo');
            petalo.innerHTML = '❁';
            petalo.style.left = `${Math.random() * 100}vw`;
            petalo.style.fontSize = `${Math.random() * 1.2 + 1}rem`;
            petalo.style.animationDuration = `${Math.random() * 5 + 8}s`;
            petalo.style.animationDelay = `${Math.random() * 5}s`;
            flotantesContainer.appendChild(petalo);
            setTimeout(() => petalo.remove(), 15000);
        }
        setInterval(crearPetalo, 800);
    </script>
</body>
</html>
